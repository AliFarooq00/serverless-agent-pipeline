[project]
name = "serverless-agent-pipeline"
version = "0.1.0"
description = "Planning-driven multi-agent support-ticket triage on AWS Step Functions (portfolio project)."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".aws-sam"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",  # assert is fine in tests
  "S310",  # urllib.urlopen is used deliberately with fixed https endpoints
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["acme_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: uses moto-mocked AWS services"]
