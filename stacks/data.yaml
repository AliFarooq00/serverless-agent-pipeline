AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Data stack - single DynamoDB table (tickets + idempotency records) and the raw-payload archive bucket.

Parameters:
  Stage:
    Type: String

Resources:
  # ---------------------------------------------------------------------------
  # Single table design
  #   pk = TICKET#<id>          sk = META                  -> ticket + final result
  #   pk = IDEMPOTENCY#ingest   sk = <hash>                -> Powertools idempotency records (TTL)
  #   gsi1pk = STATUS#<status>  gsi1sk = <updated_at>      -> "show me everything NEEDS_HUMAN"
  # ---------------------------------------------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    # Demo project: deleting the stack deletes data. For a real environment use Retain/Snapshot.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [ticket_id, status, subject, customer_tier]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true          # AWS-managed KMS key (aws/dynamodb)
      TimeToLiveSpecification:
        AttributeName: expiration # written by the Powertools idempotency utility only
        Enabled: true
      DeletionProtectionEnabled: false
      Tags:
        - { Key: stage, Value: !Ref Stage }

  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete        # `make teardown` empties it first
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: raw-payload-retention
            Status: Enabled
            Prefix: raw/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: stage, Value: !Ref Stage }

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub "${ArchiveBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  TableName:
    Value: !Ref Table
  TableArn:
    Value: !GetAtt Table.Arn
  BucketName:
    Value: !Ref ArchiveBucket
  BucketArn:
    Value: !GetAtt ArchiveBucket.Arn
