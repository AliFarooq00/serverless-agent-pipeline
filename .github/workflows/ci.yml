name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff, cfn-lint, ASL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: cfn-lint template.yaml stacks/*.yaml
      - run: python scripts/lint_asl.py

  validate:
    name: sam validate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: sam validate --lint (root and nested stacks)
        env:
          SAM_CLI_TELEMETRY: "0"
        run: |
          sam validate --lint --region us-east-1
          for t in stacks/*.yaml; do sam validate --lint --region us-east-1 -t "$t"; done
      - name: sam build (proves the arm64 layer Makefile works)
        env:
          SAM_CLI_TELEMETRY: "0"
        run: sam build

  test:
    name: pytest (unit + moto integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: >
          python -m pytest
          --cov=layers/common/acme_common --cov=functions
          --cov-report=term-missing --cov-report=xml
          --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            pytest.xml
            coverage.xml
