name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # GitHub OIDC -> AWS STS; no long-lived AWS keys in the repo
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environment holds the AWS_DEPLOY_ROLE_ARN secret and can require reviewers for prod.
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: acme-notes-triage-${{ inputs.environment }}
      CONFIG_ENV: ${{ inputs.environment == 'prod' && 'prod' || 'default' }}
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Gate on tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: sam build
        run: sam build

      - name: sam deploy
        run: >
          sam deploy
          --config-env "$CONFIG_ENV"
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --no-confirm-changeset
          --no-fail-on-empty-changeset

      - name: Smoke test /tickets
        run: >
          python scripts/send_samples.py
          --stack-name "$STACK_NAME" --region "$AWS_REGION"
          --only 001 --only 005 --wait --timeout 240 --strict --check-auth

      - name: Stack outputs
        if: always()
        run: >
          aws cloudformation describe-stacks --stack-name "$STACK_NAME"
          --query "Stacks[0].Outputs" --output table || true
